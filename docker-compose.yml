version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: simahal_postgres
    restart: always
    environment:
      POSTGRES_USER: simahal_user
      POSTGRES_PASSWORD: simahal_password
      POSTGRES_DB: simahal_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # GUI Pengelola Database (Adminer / PgAdmin alternatif yang ringan)
  adminer:
    image: adminer
    container_name: simahal_adminer
    restart: always
    ports:
      - '8080:8080'

volumes:
  postgres_data: